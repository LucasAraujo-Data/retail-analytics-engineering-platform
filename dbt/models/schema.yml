version: 2
models:
  - name: fct_order_items
    description: One row per order item for orders with approved payments and eligible status.
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
  - name: fct_returns
    columns:
      - name: return_id
        data_tests: [not_null, unique]
      - name: order_item_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_order_items')
              field: order_item_id
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product_id
        data_tests: [not_null, unique]
  - name: dim_store
    columns:
      - name: store_id
        data_tests: [not_null, unique]
  - name: dim_channel
    columns:
      - name: channel_id
        data_tests: [not_null, unique]
  - name: mart_sales_daily
    columns:
      - name: metric_date
        data_tests: [not_null, unique]
