
version: 2

models:
  - name: fct_order_items
    description: One row per order item for orders with approved payments and eligible status.
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

  - name: fct_returns
    description: One row per return event associated with an eligible sale.
    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique

      - name: order_item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_order_items')
                field: order_item_id

      
      - name: return_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - REQUESTED
                  - APPROVED
                  - REJECTED


  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_store
    columns:
      - name: store_id
        data_tests:
          - not_null
          - unique

  - name: dim_channel
    columns:
      - name: channel_id
        data_tests:
          - not_null
          - unique

  - name: mart_sales_daily
    columns:
      - name: metric_date
        data_tests:
          - not_null
          - unique
