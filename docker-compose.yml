name: retail-analytics-platform
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-retail_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - retail_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: ["pipeline"]
    environment:
      POSTGRES_HOST: postgres
      DBT_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retail_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-retail_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PIPELINE_ORDERS: ${PIPELINE_ORDERS:-15000}
      PIPELINE_SEED: ${PIPELINE_SEED:-42}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
volumes:
  retail_pgdata:
